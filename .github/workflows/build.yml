name: Firmware build

on:
    push:
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v7
              with:
                  version: "0.10.12"
            - run: uv sync --locked
            - run: uv run --locked pio run -e uno
